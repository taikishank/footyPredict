<div class="bg-slate-900">
  <nav class="mx-auto flex max-w-3xl gap-2 px-6 pt-6">
    <button
      type="button"
      class="rounded-md px-4 py-2 text-sm font-medium"
      [class.bg-emerald-600]="activeTab() === 'live'"
      [class.text-white]="activeTab() === 'live'"
      [class.text-slate-400]="activeTab() !== 'live'"
      (click)="selectTab('live')"
    >
      Live
    </button>
    <button
      type="button"
      class="rounded-md px-4 py-2 text-sm font-medium"
      [class.bg-emerald-600]="activeTab() === 'upcoming'"
      [class.text-white]="activeTab() === 'upcoming'"
      [class.text-slate-400]="activeTab() !== 'upcoming'"
      (click)="selectTab('upcoming')"
    >
      Upcoming
    </button>
  </nav>

  @if (activeTab() === 'live') {
    <app-live-dashboard [initialFixtureId]="handoffFixtureId()" />
  } @else {
    <app-upcoming-fixtures (watchLive)="watchOnLiveTab($event)" />
  }
</div>
